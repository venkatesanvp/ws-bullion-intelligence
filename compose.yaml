name: bullion-vs01
services:
  db:
    image: docker.io/library/postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/configure_local.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure_local.py}
      POSTGRES_DB: ${POSTGRES_DB:-bullion}
    volumes:
      - bullion_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bullion}
      LOCAL_APP_TOKEN: ${LOCAL_APP_TOKEN:?Run scripts/configure_local.py}
    command: [uv, run, --frozen, --no-dev, alembic, -c, backend/alembic.ini, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Provider configuration is scoped to API only, never UI/DB/migration.
    environment:
      <<: *backend_env
      DHAN_APP_NAME: ${DHAN_APP_NAME:-}
      DHAN_API_KEY: ${DHAN_API_KEY:-}
      DHAN_API_SECRET: ${DHAN_API_SECRET:-}
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      DHAN_ACCESS_TOKEN: ${DHAN_ACCESS_TOKEN:-}
      DHAN_API_BASE_URL: ${DHAN_API_BASE_URL:-https://api.dhan.co/v2}
      DHAN_DATA_API_ENABLED: ${DHAN_DATA_API_ENABLED:-false}
      MARKET_DATA_ENABLED: ${MARKET_DATA_ENABLED:-false}
      MARKET_DATA_AUTO_MISSING: ${MARKET_DATA_AUTO_MISSING:-true}
      MARKET_DATA_MAX_REQUESTS: ${MARKET_DATA_MAX_REQUESTS:-8}
      MARKET_DATA_PARTITION_DAYS: ${MARKET_DATA_PARTITION_DAYS:-366}
      MARKET_DATA_TIMEOUT_SECONDS: ${MARKET_DATA_TIMEOUT_SECONDS:-10}
      MARKET_DATA_FRESHNESS_SECONDS: ${MARKET_DATA_FRESHNESS_SECONDS:-604800}
      MARKET_DATA_EMPTY_RETRY_SECONDS: ${MARKET_DATA_EMPTY_RETRY_SECONDS:-3600}
      MARKET_DATA_FAILURE_BACKOFF_SECONDS: ${MARKET_DATA_FAILURE_BACKOFF_SECONDS:-300}
      MARKET_DATA_MIN_INTERVAL_SECONDS: ${MARKET_DATA_MIN_INTERVAL_SECONDS:-1}
      MARKET_DATA_DAILY_BUDGET: ${MARKET_DATA_DAILY_BUDGET:-1000}
      MARKET_DATA_MAX_ROWS: ${MARKET_DATA_MAX_ROWS:-100000}
      MARKET_DATA_MAX_COVERAGE_DAYS: ${MARKET_DATA_MAX_COVERAGE_DAYS:-100000}
      MARKET_DATA_AUTO_REFRESH_SECONDS: ${MARKET_DATA_AUTO_REFRESH_SECONDS:-0}
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready',headers={'Authorization':'Bearer '+os.environ['LOCAL_APP_TOKEN']}); urllib.request.urlopen(r,timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  ui:
    build:
      context: frontend
    ports:
      - 127.0.0.1:5173:5173
    depends_on:
      api:
        condition: service_healthy
  test-db:
    profiles: [test]
    image: docker.io/library/postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bullion_test
    ports:
      - 127.0.0.1:55433:5432
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d bullion_test']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  bullion_data:
